name: polygence

services:
  ############################################################
  ## Backend
  ############################################################

  backend:
    image: polygence/backend:local
    build:
      context: ./backend
      dockerfile: .docker/local/Dockerfile
    working_dir: /app
    volumes:
      - ./backend:/app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "${FORWARD_BE_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    init: true

  ############################################################
  ## Frontend
  ############################################################

  frontend:
    image: polygence/frontend:local
    build:
      context: ./frontend
      dockerfile: .docker/local/Dockerfile
    working_dir: /app
    volumes:
      - ./frontend:/app
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: npm run dev
    ports:
      - "${FORWARD_FE_PORT:-5173}:5173"
    environment:
      FORWARD_FE_PORT: "${FORWARD_FE_PORT:-5173}"
      VITE_API_TARGET: "${VITE_API_TARGET:-http://backend:8000}"
    restart: unless-stopped
    init: true
